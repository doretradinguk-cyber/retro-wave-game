name: Build Blueprint PDF

on:
  push:
    branches:
      - main
    paths:
      - "blue print plan/BLUEPRINT-PLAN.md"
      - "tools/build_blueprint_pdf.py"
      - ".github/workflows/build-blueprint-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    if: github.event.head_commit.message != 'Update blueprint plan PDF'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF dependencies
        run: |
          pip install markdown weasyprint

      - name: Build PDF
        run: python tools/build_blueprint_pdf.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "blue print plan/BLUEPRINT-PLAN.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "Update blueprint plan PDF"
          git push
